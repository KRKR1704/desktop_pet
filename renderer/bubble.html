<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Founder Pet Bubble</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 240px;
      height: 70px;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }
    .bubble {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 6px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 14px;
      padding: 10px 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      font: 13px/1.3 -apple-system, "Segoe UI", sans-serif;
      color: #222;
      text-align: center;
    }
    .bubble::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -8px;
      transform: translateX(-50%);
      border-width: 8px 8px 0 8px;
      border-style: solid;
      border-color: rgba(255, 255, 255, 0.95) transparent transparent transparent;
    }
  </style>
</head>
<body>
  <div class="bubble"><span id="text"></span></div>
</body>
</html>
